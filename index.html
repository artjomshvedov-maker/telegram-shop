<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой магазин</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial,sans-serif;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.card{
    background:white;
    border-radius:12px;
    padding:15px;
    margin:15px 0;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2ea44f;
    color:white;
    font-size:16px;
}
</style>
</head>

<body>

<h1>🫐 Blueberry Shop</h1>

<div class="card">
<h2>Голубика 1 кг</h2>
<p>Цена: 900 ₽</p>

<button onclick="buy()">
Добавить в корзину
</button>

</div>

<script>

let tg = window.Telegram.WebApp;

tg.expand();

function buy(){

tg.showAlert("Товар добавлен!");

}

</script>

</body>
</html>
